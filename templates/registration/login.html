{% extends 'base.html' %}
{% load static %}

{% block title %}Login - PayFusion{% endblock %}

{% block content %}

    <h2>Login</h2>

    <form method="post">
        {% csrf_token %}
        
        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    {% if form.errors %}
        <p style="color:red;">Invalid credentials</p>
    {% endif %}
{% endblock %}
