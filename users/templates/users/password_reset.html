{% extends 'base.html' %}
{% block title %}Reset Password — PayFusion{% endblock %}
{% block content %}
<div class="container mt-5" style="max-width:500px;">
    <h2 class="mb-1">Reset Password</h2>
    <p class="text-muted mb-4">Enter your email and we'll send you a reset link.</p>
    <div class="card" style="border:1px solid #ddd;">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Send Reset Link</button>
            </form>
        </div>
    </div>
    <div class="mt-3 text-center">
        <a href="{% url 'users:login' %}" class="small">Back to login</a>
    </div>
</div>
{% endblock %}
