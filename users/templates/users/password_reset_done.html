{% extends 'base.html' %}
{% block title %}Check Your Email — PayFusion{% endblock %}
{% block content %}
<div class="container mt-5" style="max-width:500px; text-align:center;">
    <h2 class="mb-3">Check Your Email</h2>
    <p class="text-muted">
        If an account exists for that email address, we've sent a password
        reset link. Check your inbox and spam folder.
    </p>
    <a href="{% url 'users:login' %}" class="btn btn-outline-secondary mt-3">
        Back to Login
    </a>
</div>
{% endblock %}
